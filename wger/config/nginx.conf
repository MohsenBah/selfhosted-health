# Docker embeds DNS at 127.0.0.11. Resolve upstream at request time so a
# recreated wger-web / powersync container (new IP) does not leave nginx on 502.
resolver 127.0.0.11 ipv6=off valid=10s;

map $http_x_forwarded_proto $final_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    client_max_body_size 100M;

    location /static/ {
        alias /wger/static/;
    }

    location /media/ {
        alias /wger/media/;
    }

    # PowerSync — Flutter offline sync (must be under SITE_URL, e.g. https://gym…/ps/)
    location /ps/ {
        set $powersync_upstream wger-powersync:8080;
        proxy_pass http://$powersync_upstream/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $final_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location / {
        set $wger_upstream wger-web:8000;
        proxy_pass http://$wger_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $final_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502;
    }
}

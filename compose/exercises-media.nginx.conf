server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;

    # Dataset ships index.html as an interactive browser
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(gif|jpg|jpeg|png|json|js|css|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Reminder for operators / demos — not a legal substitute for NOTICE.md
    add_header X-Media-Attribution "Gym visual https://gymvisual.com/" always;
}
